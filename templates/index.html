<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Chat Interface</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersLight =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = saved || (prefersLight ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <link href="/static/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <header>
        <div class="header-left">
          <h1>AI Chat Interface</h1>
        </div>

        <div class="toggles">
          <button
            id="historyBtn"
            type="button"
            class="ghost-btn"
            aria-haspopup="dialog"
            aria-controls="historyPanel"
            aria-label="Show previous chats"
          >
            Chats
          </button>

          <button
            id="newChatBtn"
            type="button"
            class="ghost-btn"
            aria-label="Start a new conversation"
          >
            New chat
          </button>

          <button
            id="themeToggle"
            type="button"
            class="theme-toggle"
            aria-pressed="false"
            aria-label="Toggle light and dark mode"
          >
            <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
            <span class="theme-toggle-label">Dark</span>
          </button>

          <label class="model-select">
            Model
            <select id="modelSelect" data-default="{{ model }}">
              <option value="{{ model }}">{{ model }}</option>
            </select>
          </label>

          <label>
            <input id="streamToggle" type="checkbox" checked />
            Stream
          </label>

          <label>
            <input id="sysToggle" type="checkbox" />
            Send system prompt
          </label>
        </div>
      </header>

      <div class="chat-wrap">
        <main
          id="chat"
          role="log"
          aria-live="polite"
          aria-relevant="additions text"
          aria-label="Chat messages"
        ></main>

        <div id="dropOverlay" class="drop-overlay" hidden></div>

        <button
          id="scrollBottomBtn"
          type="button"
          class="scroll-bottom"
          aria-label="Jump to latest message"
          hidden
        >
          ↓ Latest
        </button>
      </div>

      <form id="composer">
        <textarea
          id="prompt"
          rows="3"
          placeholder="Ask your question…"
          aria-label="Prompt"
        ></textarea>

        <div class="row file-tools">
          <button id="attachBtn" type="button">Attach .txt</button>
          <input id="fileInput" type="file" accept=".txt" hidden />
          <button id="attachVideoBtn" type="button">Attach video</button>
          <input
            id="videoInput"
            type="file"
            accept="video/mp4,video/quicktime,video/webm,video/x-matroska,video/x-msvideo,.mp4,.mov,.webm,.mkv,.avi,.m4v"
            hidden
          />
          <span id="fileBadge" class="file-badge" hidden></span>
          <button id="clearFileBtn" type="button" class="link danger" hidden>
            Remove
          </button>

          <input
            id="taskInput"
            type="text"
            placeholder="Task (optional, e.g., Extract entities & dates)"
            aria-label="File analysis task"
          />

          <label class="nowrap">
            Frames
            <input id="framesInput" type="number" min="1" max="32" value="8" />
          </label>

          <label class="nowrap">
            <input id="fileStreamToggle" type="checkbox" checked />
            Stream file analysis
          </label>
        </div>

        <div class="row">
          <input
            id="system"
            type="text"
            placeholder="System prompt (optional)"
            aria-label="System prompt"
          />
          <button id="sendBtn" type="submit">Send</button>
          <button id="stopBtn" type="button" class="link" hidden>Stop</button>
        </div>

        <div class="row small controls-row">
          <label>
            Max tokens
            <input
              id="numPredict"
              type="number"
              min="-1"
              max="32768"
              value="-1"
            />
          </label>

          <label>
            Temp
            <input
              id="temp"
              step="0.1"
              type="number"
              min="0"
              max="1"
              value="0.2"
            />
          </label>

          <label>
            Context
            <input
              id="numCtx"
              type="number"
              min="2048"
              max="32768"
              value="8192"
            />
          </label>
        </div>
      </form>

      <div id="historyBackdrop" class="history-backdrop" hidden></div>
      <aside
        id="historyPanel"
        class="history-panel"
        role="dialog"
        aria-label="Previous chats"
        hidden
      >
        <div class="history-head">
          <h2>Previous chats</h2>
          <button
            id="historyCloseBtn"
            type="button"
            class="ghost-btn"
            aria-label="Close chat history"
          >
            ✕
          </button>
        </div>
        <div class="history-search">
          <input
            id="historySearch"
            type="search"
            placeholder="Search chats…"
            aria-label="Search chats"
            autocomplete="off"
          />
        </div>
        <ul id="historyList" class="history-list"></ul>
      </aside>
    </div>

    <script src="/static/vendor/marked.min.js"></script>
    <script src="/static/vendor/marked-footnote.min.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
    <script src="/static/vendor/highlight.min.js"></script>
    <script src="/static/main.js"></script>
  </body>
</html>
